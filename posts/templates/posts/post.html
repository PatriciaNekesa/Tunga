{% extends "base.html" %}
{% block content %}
<h2>Create a New Post</h2>
<form method="POST">
    {{ form.hidden_tag() }}
    <p>{{ form.title.label }}<br> {{ form.title(class="form-control") }}</p>
    <p>{{ form.content.label }}<br> {{ form.content(class="form-control") }}</p>
    <p>{{ form.submit(class="btn btn-primary") }}</p>
</form>
{% endblock %}

{% endblock %}
