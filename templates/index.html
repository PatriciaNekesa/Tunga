{% extends "base.html" %}
{% block title %}Home - My Blog{% endblock %}
{% block content %}
    <h1>Welcome to My Blog</h1>
    <div class="row">
        {% for post in posts %}
        <div class="col-md-6">
            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="card-title">{{ post.title }}</h5>
                    <p class="card-text">{{ post.content[:100] }}...</p>
                    <p class="text-muted">By {{ post.author }}</p>
                    <a href="{{ url_for('view_post', post_id=loop.index0) }}" class="btn btn-primary">Read More</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
{% endblock %}
