{% extends "base.html" %}
{% block title %}{{ post.title }} - My Blog{% endblock %}
{% block content %}
    <h1>{{ post.title }}</h1>
    <p class="text-muted">By {{ post.author }}</p>
    <p>{{ post.content }}</p>
    <a href="{{ url_for('home') }}" class="btn btn-secondary">Back to Home</a>
{% endblock %}
